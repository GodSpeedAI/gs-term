[project]
name = "gsterm-solidlsp"
version = "0.1.0"
description = "gs-term SolidLSP bridge: stdio JSON-lines language-intelligence server backed by the solidlsp package from serena-agent 1.7.0"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # The MIT-licensed SolidLSP distribution is the wheel `serena-agent==1.7.0`.
    # EXACTLY 1.7.0: upstream main relicensed the Serena application to GPL after
    # this release. We import ONLY the bundled `solidlsp` package, never `serena`.
    "serena-agent==1.7.0",
]

[project.scripts]
gsterm-solidlsp = "gsterm_solidlsp.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsterm_solidlsp"]
