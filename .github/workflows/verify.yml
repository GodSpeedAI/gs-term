# gs-term clean-machine oracle (Phase 3.6).
#
# Proves the portability story from a fresh GitHub-hosted runner:
#   checkout -> bootstrap (SELF-CONTAINED: pinned bun 1.4.x, rustup 1.98.0
#   helper build, uv SolidLSP) -> release verification -- with Node invisible to
#   the product path and NO semantic skips (GSTERM_REQUIRE_SEMANTIC=1).
#
# The invariant is not "the runner image contains zero Node binaries" (GitHub's
# own machinery needs Node); it is that gs-term's bootstrap/runtime/verification
# environment does not depend on or resolve Node -- enforced inside
# scripts/verify-all.sh --release via the PATH scrub + node->bun shim check.
#
# Devbox adjudication (D-040, evidence from the first CI attempts): the devbox
# nix profile binaries from current nixpkgs demand GLIBC 2.42/2.43 and fail on
# ubuntu-24.04 runners (glibc 2.39) through the host loader -- the same
# nix-glibc boundary that breaks builds on the WSL host. Devbox therefore
# remains the LOCAL reproducibility oracle; CI exercises the same committed
# scripts (scripts/bootstrap.sh + scripts/verify-all.sh --release) directly on
# the host toolchain, which bootstrap.sh makes self-contained and explicit.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-oracle:
    name: clean-machine semantic oracle (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Caches are acceleration, never correctness: a full cache miss still
      # bootstraps everything from the network (bun zip, crates, model, wheels).
      - name: Cache cargo (registry/git)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache cargo build artifacts
        uses: actions/cache@v4
        with:
          path: rust/target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache uv (SolidLSP environment)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            solidlsp/.venv
          key: uv-${{ runner.os }}-${{ hashFiles('solidlsp/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      # Warm potion model (~34 MB, sha256-pinned revision) -- key never changes
      # until the pinned revision in the helper changes.
      - name: Cache potion embedding model
        uses: actions/cache@v4
        with:
          path: ~/.zvec-grep/models
          key: potion-model-e9d2a44ca6a05ac6685f3b23709ea57eb7352d5b

      - name: Record tool versions (debug evidence)
        run: |
          set -o pipefail
          {
            echo "== host =="; uname -a; ldd --version | head -1
            echo "cc: $(cc --version | head -1)"; echo "cmake: $(cmake --version | head -1)"
            echo "rg: $(rg --version | head -1)"; echo "git: $(git --version)"
            echo "python3: $(python3 --version 2>&1)"
            echo "node on host PATH (informational; scrubbed for product): $(command -v node || echo none)"
          } | tee /tmp/gsterm-versions.log

      - name: Bootstrap (bun + rustup 1.98.0 + helper build + solidlsp sync)
        shell: bash
        run: |
          set -o pipefail
          bash scripts/bootstrap.sh 2>&1 | tee /tmp/gsterm-bootstrap.log

      - name: Provision Playwright chromium
        run: |
          "$GITHUB_WORKSPACE/.devbin/bin/bun" x playwright install --with-deps chromium

      - name: Release verification (node-free, no semantic skips)
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify-all.sh --release 2>&1 | tee /tmp/gsterm-verify.log

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gsterm-failure-logs
          path: |
            /tmp/gsterm-versions.log
            /tmp/gsterm-bootstrap.log
            /tmp/gsterm-verify.log
          if-no-files-found: ignore
          retention-days: 14
